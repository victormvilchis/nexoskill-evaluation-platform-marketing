name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Validar código, contenido y SEO
        run: npm run check
      - name: Validar plantilla de despliegue
        run: npm run deployment:validate
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E y accesibilidad
        run: npm run test:e2e -- --project=chromium
      - name: Publicar reporte E2E si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas y empaquetado
        run: mvn -B -f backend/pom.xml clean verify

  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bloquear secretos y artefactos locales
        run: npm run repository:guard


  deployment-config:
    name: Deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar variables de ejemplo
        run: node scripts/deployment/validate-production-env.mjs --example .env.production.example
      - name: Validar Docker Compose productivo
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
          rm -f .env.production
