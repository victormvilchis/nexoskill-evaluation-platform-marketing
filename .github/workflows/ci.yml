name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Validar código, contenido y SEO
        run: npm run check
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E y accesibilidad
        run: npm run test:e2e -- --project=chromium
      - name: Publicar reporte E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas y empaquetado
        run: mvn -B -f backend/pom.xml clean verify

  repository-guard:
    name: Repository guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bloquear secretos y artefactos locales
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if echo "$tracked" | grep -E '(^|/)\.env($|\.local$|\.production$)'; then
            echo 'Se detectó un archivo de configuración sensible versionado.' >&2
            exit 1
          fi
          if git grep -nEi 'EvaluationApp123|(DB_PASSWORD|MAIL_PASSWORD)=[^$[:space:]][^[:space:]]+' -- ':!*.example' ':!*.md' ':!.github/workflows/ci.yml'; then
            echo 'Se detectó un posible secreto en el repositorio.' >&2
            exit 1
          fi
