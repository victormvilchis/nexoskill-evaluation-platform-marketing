spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    ip-hash-salt: ${IP_HASH_SALT}
    trust-forwarded-headers: true
