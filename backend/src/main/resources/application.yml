server:
  port: ${BACKEND_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: valtieris-marketing-backend
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: ValtierisMarketingPool
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      connection-timeout: 20000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/oracle
    table: MKT_FLYWAY_HISTORY
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Valtieris Marketing Backend
    version: 1.1.0
    commit: ${APP_COMMIT:unknown}
    build-time: ${APP_BUILD_TIME:unknown}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  mail:
    enabled: ${MAIL_ENABLED:false}
    recipient: ${CONTACT_RECIPIENT:}
    from: ${MAIL_FROM:}
    brand-name: Valtieris
  spam:
    minimum-completion-time: ${SPAM_MIN_COMPLETION_TIME:2s}
    maximum-completion-time: ${SPAM_MAX_COMPLETION_TIME:24h}
    duplicate-window: ${SPAM_DUPLICATE_WINDOW:3m}
    maximum-urls: ${SPAM_MAX_URLS:2}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:8}
    window: ${RATE_LIMIT_WINDOW:15m}
  security:
    ip-hash-salt: ${IP_HASH_SALT:change-this-before-production}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
