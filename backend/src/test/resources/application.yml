spring:
  datasource:
    url: jdbc:h2:mem:marketing;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  mail:
    enabled: false

  spam:
    minimum-completion-time: 0s
    maximum-completion-time: 24h
    duplicate-window: 0s
    maximum-urls: 2
  security:
    ip-hash-salt: test-salt-test-salt-test-salt-test
