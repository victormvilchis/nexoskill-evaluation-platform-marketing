services:
  marketing-api:
    build:
      context: ./backend
    environment:
      BACKEND_PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      IP_HASH_SALT: ${IP_HASH_SALT}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketing-web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        VITE_API_URL: /api
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_PRIVACY_EMAIL: ${VITE_PRIVACY_EMAIL:-}
        VITE_LEGAL_ENTITY: ${VITE_LEGAL_ENTITY:-Valtieris}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
        VITE_ENABLE_ANALYTICS: ${VITE_ENABLE_ANALYTICS:-false}
        VITE_GTM_ID: ${VITE_GTM_ID:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      marketing-api:
        condition: service_healthy
    restart: unless-stopped
