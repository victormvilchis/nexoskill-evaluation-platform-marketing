services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  marketing-api:
    environment:
      MAIL_ENABLED: "true"
      MAIL_HEALTH_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_STARTTLS_REQUIRED: "false"
      MAIL_FROM: no-reply@nexoskill.local
      CONTACT_RECIPIENT: ventas@nexoskill.local
    depends_on:
      mailpit:
        condition: service_started
